<div class="contact-modal-backdrop">
  <div class="container section">
    <div class="contact-modal section container">
      <button class="close-modal-btn contact-modal-btn" type="button">
        <svg class="close-modal-svg" width="24px" height="24px">
          <use href="../img/sprite.svg#close"></use>
        </svg>
      </button>
      <div class="contact-modal-wrapper">
        <h2 class="section-title">Офомлення замовлення</h2>
        <form class="contact-form">
          <label class="contact-name-label"
            >Ім’я*
            <input
              type="text"
              class="contact-name-input"
              placeholder="Вікторія"
              name="name"
            />
          </label>
          <label class="contact-tel-label">
            Телефон*
            <input
              type="tel"
              class="contact-tel-input"
              placeholder="38 0__ _______"
              name="tel"
            />
          </label>
          <label class="contact-comment-label"
            >Коментар*
            <textarea
              class="contact-comment-textarea"
              placeholder="Ваш коментар"
              name="comment"
            ></textarea>
          </label>
          <button class="btn contact-modal-submit-btn" type="submit">
            Надіслати заявку
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
